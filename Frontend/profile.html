<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TastyHub - My Profile</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>



    <!-- ==========================================
         PROFILE PAGE
    =========================================== -->

    <main class="profile-page">

        <div class="profile-page-header">

            <div>

                <h1>
                    👤 My Profile
                </h1>

                <p>
                    Manage your account and view your orders
                </p>

            </div>


            <a
                href="index.html"
                class="back-home-btn"
            >
                ← Back to TastyHub
            </a>

        </div>


        <!-- ======================================
             PROFILE DETAILS
        ======================================= -->

        <section class="profile-details-section">

            <div id="profile-info">

                <div class="loading-message">
                    Loading profile...
                </div>

            </div>

        </section>


        <!-- ======================================
             ORDER HISTORY
        ======================================= -->

        <section class="orders-history-section">

            <div class="orders-title">

                <h2>
                    🛍️ My Orders
                </h2>

                <p>
                    Your complete order history
                </p>

            </div>


            <div id="profile-orders-list">

                <div class="loading-message">
                    Loading orders...
                </div>

            </div>

        </section>


        <!-- ======================================
             LOGOUT
        ======================================= -->

        <button
            id="logout-btn"
            class="profile-logout-btn"
        >
            🚪 Logout
        </button>

    </main>


    <script src="profile.js"></script>

</body>

</html>
