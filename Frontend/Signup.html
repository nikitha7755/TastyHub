<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TastyHub - Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">🍴</div>

            <!-- Heading -->
            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join TastyHub and start ordering your favorite food
            </p>


            <!-- Signup Form -->
            <form id="signup-form">


                <!-- Username -->
                <div class="input-group">

                    <label for="signup-name">
                        Username
                    </label>

                    <input
                        type="text"
                        id="signup-name"
                        name="name"
                        placeholder="Enter username"
                        required
                        autocomplete="username"
                    >

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="signup-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="Enter email address"
                        required
                        autocomplete="email"
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signup-password"
                        name="password"
                        placeholder="Enter password"
                        required
                        autocomplete="new-password"
                    >

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm password"
                        required
                        autocomplete="new-password"
                    >

                </div>


                <!-- Signup Message -->
                <div
                    id="signup-message"
                    class="auth-message"
                ></div>


                <!-- Create Account Button -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->
            <div class="auth-footer">

                <p>
                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="signup.js"></script>

</body>

</html>
